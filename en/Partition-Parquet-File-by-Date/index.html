    <header class="post-header">
      <h1 class="post-title">Partition Parquet File by Date
        </h1>

      <div class="post-meta">
        <span class="post-time">
          2019-04-07
        </span></div>
    </header>

    <div class="post-content"><p>The pyspark script below can split one single big parquet file into small parquet files based on <code>date</code> column. </p>
<figure class="highlight python"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br></pre></td><td class="code"><pre><span class="line"><span class="keyword">from</span> pyspark.sql.functions <span class="keyword">import</span> col, dayofmonth, month, year</span><br><span class="line"></span><br><span class="line">df = <span class="comment">#load data frame</span></span><br><span class="line"></span><br><span class="line">dt = col(<span class="string">"date"</span>).cast(<span class="string">"date"</span>)</span><br><span class="line">fname = [(year, <span class="string">"year"</span>), (month, <span class="string">"month"</span>), (dayofmonth, <span class="string">"day"</span>)]</span><br><span class="line">exprs = [col(<span class="string">"*"</span>)] + [f(dt).alias(name) <span class="keyword">for</span> f, name <span class="keyword">in</span> fname]</span><br><span class="line"></span><br><span class="line">(df.select(*exprs).write.partitionBy(*(name <span class="keyword">for</span> _, name <span class="keyword">in</span> fname)).mode(<span class="string">"overwrite"</span>).parquet(<span class="string">'output_location'</span>))</span><br></pre></td></tr></table></figure>
<p>The output will be structured like <code>year=2019\month=04\day=01</code></p>
